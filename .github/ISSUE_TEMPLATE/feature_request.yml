name: Feature request
description: Propose a focused Agent Forge workflow or documentation improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What user workflow would this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest behavior change that would solve the problem.
    validations:
      required: true
  - type: dropdown
    id: planning-impact
    attributes:
      label: Planning impact
      description: Which part of the Plan workflow does this primarily affect?
      options:
        - invocation
        - environment grounding
        - clarification
        - draft artifact
        - final checklist
        - documentation
        - unclear
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Boundaries
      description: What should this feature avoid doing?
